services:
  - type: web
    name: RESTAURENT-QR-ORDERING-
    runtime: node
    region: oregon
    plan: free
    healthCheckPath: /health
    rootDir: .
    buildCommand: npm install --include=dev --prefix server && npm install --prefix client && npm run db:migrate:safe --prefix server
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Owner-managed: set to unconfigured or a supported, credentialed provider.
      - key: PAYMENT_PROVIDER
        sync: false
      - key: MESSAGING_PROVIDER
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: MIGRATION_BACKUP_CONFIRMED
        value: "true"
      - key: MIGRATION_BASELINE_CONFIRMED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://restaurant-qr-ordering.onrender.com/api/auth/google/callback
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_API_VERSION
        sync: false
      - key: SAAS_PLAN_PRICING_JSON
        sync: false
      - key: SAAS_PAYMENT_PROVIDER
        value: unconfigured
      - key: SAAS_RAZORPAY_KEY_ID
        sync: false
      - key: SAAS_RAZORPAY_KEY_SECRET
        sync: false
      - key: SAAS_RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SAAS_TRIAL_DAYS
        value: 0
      - key: SAAS_GRACE_DAYS
        value: 0
      - key: SAAS_PENDING_MINUTES
        value: 30
      - key: COMPANY_LEGAL_NAME
        sync: false
      - key: COMPANY_SUPPORT_EMAIL
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_REGISTRATION_NUMBER
        sync: false
      - key: AI_PROVIDER
        value: unconfigured
      - key: AI_API_KEY
        sync: false
      - key: PLATFORM_SUPER_ADMIN_EMAILS
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: menu-images
      - key: CLIENT_URL
        value: https://restaurant-qr-ordering.onrender.com
      - key: SERVER_URL
        value: https://restaurant-qr-ordering.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FORCE_HTTPS
        value: true
      - key: LOG_LEVEL
        value: info
